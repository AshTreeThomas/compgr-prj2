<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project 2 - WebGL</title>
    <style>
        html, body { margin: 0; height: 100%; background: black; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(255, 255, 255, 0.9); padding: 15px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3); max-width: 320px; font-family: sans-serif; }
        .level-buttons { margin-top: 10px; } 
        .level-btn { padding: 6px 12px; margin-right: 5px; cursor: pointer; border: 1px solid #ccc; background: #f0f0f0; border-radius: 4px; } 
        .level-btn.active { background-color: #007bff; color: white; border-color: #0056b3; }
        .controls { margin-top: 10px; font-size: 12px; color: #333; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>

    <div id="info">
        <b>Project 2</b><br>
        <b>By Thomas</b><br>
        <div class="level-buttons">
            <button class="level-btn active" id="btn-lvl0" onclick="setLevel(0)">Level 0</button>
            <button class="level-btn" id="btn-lvl1" onclick="setLevel(1)">Level 1</button>
            <button class="level-btn" id="btn-lvl2" onclick="setLevel(2)">Level 2</button>
            <button class="level-btn" id="btn-lvl3" onclick="setLevel(3)">Level 3</button>
        </div>
        <div class="controls">
            <i>Use up and down arrow keys to adjust landscape height scale.</i>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
